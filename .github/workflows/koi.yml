name: Koi

on:
  schedule:
    # Just after midnight UTC, so the koi shows the day that just ended.
    - cron: "20 0 * * *"
  workflow_dispatch:
  push:
    paths: [.github/workflows/koi.yml]

permissions:
  contents: write

concurrency: koi

jobs:
  koi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache git-koi binary
        id: cache-git-koi
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/git-koi
          key: ${{ runner.os }}-git-koi-wide-v1
      - name: Install latest git-koi with wide pond support
        if: steps.cache-git-koi.outputs.cache-hit != 'true'
        run: cargo install --git https://github.com/yalongwastaken/git-koi.git
      - name: Collect and render wide koi pond
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          git-koi collect Aniketchavan7 --output /tmp/snapshot.json
          git-koi render /tmp/snapshot.json --output-dir koi --body white --size 768x256 --scale 1
      - name: Commit the koi if it changed
        shell: bash
        run: |
          git add koi/koi.gif
          if git diff --cached --quiet; then
            echo "The koi is unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --quiet --message "koi: draw the day's koi"
          git push --quiet
