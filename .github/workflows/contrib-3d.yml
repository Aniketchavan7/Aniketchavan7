name: 3D contributions

on:
  schedule:
    - cron: "40 0 * * *"
  workflow_dispatch:
  push:
    paths: [.github/workflows/contrib-3d.yml]

permissions:
  contents: write

concurrency: profile-assets

jobs:
  contrib:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - name: Commit the graph if it changed
        shell: bash
        run: |
          git add profile-3d-contrib
          if git diff --cached --quiet; then
            echo "Graph unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --quiet --message "chore: refresh 3D contribution graph"
          git pull --quiet --rebase
          git push --quiet
